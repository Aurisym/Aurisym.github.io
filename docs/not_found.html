<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="./img/icon.png">
  <link rel="stylesheet" href="./404.css">

  <title>AURIX 1.1.0: ERR404</title>
</head>

<body>
  <h1 class="face">:(</h1>
  <main class="container">

    <p class="big-text">
      Don't panic! Your system seems to be fine! The page you tried to enter however, does not exist.<br>
      Are you sure you typed the URL correctly? It may have been moved, deleted, or never existed.
    </p>

    <p class="code">
      <b>ERROR CODE:</b> HTML_ERROR_404
    </p>

    <p class="small-text">
      The requested material was not found on the server.
    </p>
  </main>
</body>
</html>
